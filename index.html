<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeBron James and the Greats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
  <!-- Basketball court background: lines are drawn top-down, center circle sits on the divider -->
  <svg class="court" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <radialGradient id="glowL" cx="25%" cy="45%" r="55%"><stop offset="0" style="stop-color:var(--cl);stop-opacity:.34"/><stop offset="1" style="stop-color:var(--cl);stop-opacity:0"/></radialGradient>
      <radialGradient id="glowR" cx="75%" cy="45%" r="55%"><stop offset="0" style="stop-color:var(--cr);stop-opacity:.34"/><stop offset="1" style="stop-color:var(--cr);stop-opacity:0"/></radialGradient>
      <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151925"/><stop offset="1" stop-color="#0b0d14"/></linearGradient>
      <pattern id="boards" width="40" height="560" patternUnits="userSpaceOnUse"><rect width="1" height="560" x="39" fill="#fff" opacity=".025"/></pattern>
    </defs>
    <rect width="1000" height="560" fill="url(#floor)"/>
    <rect width="1000" height="560" fill="url(#boards)"/>
    <rect width="1000" height="560" fill="url(#glowL)"/>
    <rect width="1000" height="560" fill="url(#glowR)"/>
    <g fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="2.5">
      <rect x="20" y="20" width="960" height="520"/>
      <line x1="500" y1="20" x2="500" y2="540"/>
      <circle cx="500" cy="280" r="70"/>
      <circle cx="500" cy="280" r="22"/>
      <!-- left half -->
      <rect x="20" y="190" width="190" height="180"/>
      <path d="M210 215 A65 65 0 0 1 210 345"/>
      <path d="M20 70 H100 A215 215 0 0 1 100 490 H20"/>
      <circle cx="62" cy="280" r="9"/>
      <!-- right half -->
      <rect x="790" y="190" width="190" height="180"/>
      <path d="M790 215 A65 65 0 0 0 790 345"/>
      <path d="M980 70 H900 A215 215 0 0 0 900 490 H980"/>
      <circle cx="938" cy="280" r="9"/>
    </g>
  </svg>
  <div class="vignette"></div>

  <header class="top">
    <h1>LeBron James <span>and the Greats</span></h1>
    <div class="mode" id="mode" role="group" aria-label="Which stats to show"></div>
  </header>

  <main class="split">
    <section class="side" id="left" data-side="left"></section>
    <div class="divider" aria-hidden="true"></div>
    <section class="side" id="right" data-side="right"></section>
  </main>

  <section class="h2h" id="h2h"></section>

  <footer>ICS/CINE 484 final project · Stats: <a href="https://www.basketball-reference.com" target="_blank" rel="noopener">Basketball-Reference</a> · Add players in <code>data/</code></footer>

  <script src="js/registry.js"></script>
  <!-- One line per player. Add yours here (see CONTRIBUTING.md). -->
  <script src="data/lebron-james.js"></script>
  <script src="data/michael-jordan.js"></script>
  <script src="data/kobe-bryant.js"></script>
  <script src="data/stephen-curry.js"></script>
  <script src="data/shaquille-oneal.js"></script>
  <script src="data/kareem-abdul-jabbar.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ball.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/play.js"></script>
  <script src="js/action.js"></script>
</body>
</html>
